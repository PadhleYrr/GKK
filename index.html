<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet — Personal Spending Tracker</title>
<meta name="theme-color" content="#0f1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
/* ===== DESIGN TOKENS ===== */
:root {
  --bg: #0f1117;
  --bg2: #161922;
  --bg3: #1d2130;
  --bg4: #242838;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f2ff;
  --text2: #8b92b0;
  --text3: #4f566b;
  --primary: #6e56cf;
  --primary-light: rgba(110,86,207,0.15);
  --primary-dark: #5240a8;
  --accent: #f06292;
  --gold: #f5c542;
  --success: #43c6a8;
  --warning: #f5c542;
  --danger: #f06292;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-hover: 0 8px 40px rgba(110,86,207,0.25);
  --font: 'Archivo', sans-serif;
  --font-display: 'Fraunces', serif;
  --font-mono: 'JetBrains Mono', monospace;
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 256px;
  height: 100dvh;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
  transition: transform 0.3s;
}

.sidebar-logo {
  padding: 26px 20px 22px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}

.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
}

.logo-name {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
}
.logo-sub { font-size: 10px; color: var(--text3); letter-spacing: 0.5px; margin-top: 2px; }

.nav-section { padding: 16px 12px 4px; }
.nav-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  padding: 0 8px;
  margin-bottom: 4px;
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text2);
  font-size: 13.5px;
  font-weight: 500;
  transition: all 0.2s;
  margin-bottom: 2px;
  position: relative;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.nav-item.active {
  color: var(--text);
  background: var(--primary-light);
  font-weight: 600;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  background: var(--primary);
  border-radius: 0 3px 3px 0;
}
.nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

.nav-badge {
  margin-left: auto;
  background: var(--primary);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
}

/* ===== MAIN ===== */
.main {
  margin-left: 256px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-x: hidden;
}

.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  height: 62px;
  padding: 0 28px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  flex-shrink: 0;
}

.topbar-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  color: var(--text);
}

.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  color: var(--text2);
  transition: all 0.2s;
}
.topbar-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

.mobile-menu-btn {
  display: none; background: none; border: none;
  font-size: 20px; cursor: pointer; color: var(--text);
}

/* ===== PAGES ===== */
.page { display: none; padding: 28px; flex: 1; }
.page.active { display: block; }

/* ===== CARDS ===== */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: box-shadow 0.2s;
}
.card:hover { box-shadow: var(--shadow-hover); }
.card-header {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--text); }
.card-body { padding: 22px; }

/* ===== STAT CARDS ===== */
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
}
.stat-card::after {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: var(--primary);
  opacity: 0.05;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-icon {
  width: 42px; height: 42px;
  border-radius: 11px;
  background: var(--primary-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  margin-bottom: 14px;
}
.stat-label { font-size: 11px; color: var(--text2); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
.stat-value { font-size: 26px; font-weight: 700; color: var(--text); font-family: var(--font-mono); }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 5px; }

/* ===== GRIDS ===== */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* ===== FORMS ===== */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  background: var(--bg3);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  transition: all 0.2s;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--primary);
  background: var(--bg4);
  box-shadow: 0 0 0 3px var(--primary-light);
}
.form-input::placeholder { color: var(--text3); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: none; cursor: pointer;
  font-family: var(--font);
  font-size: 13.5px; font-weight: 600;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(110,86,207,0.4); }
.btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); }
.btn-ghost:hover { background: var(--bg4); color: var(--text); }
.btn-success { background: var(--success); color: var(--bg); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }
.btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 8px; }

/* ===== BADGES ===== */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.badge-success { background: rgba(67,198,168,0.15); color: var(--success); }
.badge-danger { background: rgba(240,98,146,0.15); color: var(--danger); }
.badge-warning { background: rgba(245,197,66,0.15); color: var(--warning); }
.badge-primary { background: var(--primary-light); color: var(--primary); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  z-index: 1000;
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  width: 100%; max-width: 500px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  animation: slideUp 0.25s ease;
  max-height: 92vh;
  overflow-y: auto;
}
.modal-wide { max-width: 640px; }
.modal-header {
  padding: 22px 26px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 17px; font-weight: 700; font-family: var(--font-display); }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px; border: 1px solid var(--border2);
  background: var(--bg3); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text2); transition: all 0.2s;
}
.modal-close:hover { background: var(--danger); color: white; border-color: var(--danger); }
.modal-body { padding: 26px; }
.modal-footer {
  padding: 18px 26px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== PILL TABS ===== */
.pill-tabs {
  display: flex; gap: 4px;
  background: var(--bg3);
  padding: 4px; border-radius: 10px;
  width: fit-content;
}
.pill-tab {
  padding: 6px 16px; border-radius: 8px;
  font-size: 12.5px; font-weight: 600;
  cursor: pointer; color: var(--text2);
  transition: all 0.2s;
  border: none; background: transparent;
  font-family: var(--font);
}
.pill-tab.active { background: var(--bg2); color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--bg4);
  color: var(--text);
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13.5px; font-weight: 500;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  border: 1px solid var(--border2);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  display: flex; align-items: center; gap: 8px;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center; padding: 48px 24px; color: var(--text3);
}
.empty-icon { font-size: 44px; margin-bottom: 12px; }
.empty-text { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text2); }
.empty-sub { font-size: 12.5px; }

/* ===== TABLE ===== */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; }
th { padding: 10px 14px; font-size: 10.5px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; text-align: left; background: var(--bg3); }
td { padding: 12px 14px; font-size: 13.5px; color: var(--text); border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg3); }

/* ===== EXPENSE ITEM ===== */
.expense-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  cursor: pointer;
}
.expense-item:last-child { border-bottom: none; }
.expense-item:hover { background: var(--bg3); }

.expense-icon-wrap {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  overflow: hidden;
}
.expense-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }

.expense-info { flex: 1; min-width: 0; }
.expense-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.expense-meta { font-size: 11.5px; color: var(--text3); margin-top: 2px; }
.expense-right { text-align: right; flex-shrink: 0; }
.expense-amount { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--danger); }
.expense-date { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ===== CATEGORY ICON PICKER ===== */
.category-picker {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-top: 8px;
}
.cat-icon-btn {
  aspect-ratio: 1;
  border-radius: 10px;
  border: 2px solid var(--border2);
  background: var(--bg3);
  cursor: pointer;
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  padding: 0;
}
.cat-icon-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: scale(1.05); }
.cat-icon-btn.selected { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 2px var(--primary); }

/* Custom image icon */
.icon-upload-btn {
  aspect-ratio: 1;
  border-radius: 10px;
  border: 2px dashed var(--border2);
  background: var(--bg3);
  cursor: pointer;
  font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  padding: 0; overflow: hidden;
}
.icon-upload-btn:hover { border-color: var(--primary); }
.icon-upload-btn img { width: 100%; height: 100%; object-fit: cover; }

/* ===== PROGRESS BAR ===== */
.progress-bar {
  height: 6px; border-radius: 6px;
  background: var(--bg4);
  overflow: hidden; margin-top: 8px;
}
.progress-fill {
  height: 100%; border-radius: 6px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.4s;
}

/* ===== BUDGET CARD ===== */
.budget-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.budget-card:hover { box-shadow: var(--shadow-hover); }
.budget-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.budget-cat { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.budget-amounts { font-size: 12.5px; color: var(--text2); }
.budget-amounts span { font-family: var(--font-mono); font-weight: 600; }

/* ===== DASHBOARD HERO ===== */
.dash-hero {
  background: linear-gradient(135deg, #1a1040 0%, #0f1117 60%);
  border: 1px solid rgba(110,86,207,0.2);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin-bottom: 22px;
  position: relative;
  overflow: hidden;
}
.dash-hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(110,86,207,0.25), transparent 70%);
}
.dash-hero::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 20px;
  width: 150px; height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(240,98,146,0.12), transparent 70%);
}
.hero-greeting { font-size: 13px; color: var(--text3); font-weight: 500; margin-bottom: 6px; }
.hero-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--text); }
.hero-subtitle { font-size: 13px; color: var(--text2); margin-top: 6px; }

/* ===== MONTH SELECTOR ===== */
.month-nav {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); padding: 6px 12px;
  border-radius: 10px; border: 1px solid var(--border2);
}
.month-nav-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text2); font-size: 16px; padding: 2px 6px;
  transition: color 0.15s;
}
.month-nav-btn:hover { color: var(--primary); }
.month-nav-label { font-size: 13px; font-weight: 600; min-width: 120px; text-align: center; }

/* ===== RECURRING BADGE ===== */
.recurring-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(245,197,66,0.12);
  color: var(--gold);
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  margin-left: 6px;
}

/* ===== SIDEBAR OVERLAY ===== */
.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 99;
}
.sidebar-overlay.open { display: block; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .mobile-menu-btn { display: flex; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .page { padding: 16px; }
  .dash-hero { padding: 22px 20px; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">💸</div>
    <div>
      <div class="logo-name">My Wallet</div>
      <div class="logo-sub">Personal Finance Tracker</div>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Overview</div>
    <div class="nav-item active" onclick="navTo('dashboard',this)"><span class="nav-icon">🏠</span> Dashboard</div>
    <div class="nav-item" onclick="navTo('analytics',this)"><span class="nav-icon">📊</span> Analytics</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Spending</div>
    <div class="nav-item" onclick="navTo('add',this)"><span class="nav-icon">➕</span> Add Expense</div>
    <div class="nav-item" onclick="navTo('history',this)"><span class="nav-icon">📋</span> All Expenses <span class="nav-badge" id="exp-count-badge">0</span></div>
    <div class="nav-item" onclick="navTo('recurring',this)"><span class="nav-icon">🔄</span> Recurring</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Planning</div>
    <div class="nav-item" onclick="navTo('budgets',this)"><span class="nav-icon">🎯</span> Budgets</div>
    <div class="nav-item" onclick="navTo('categories',this)"><span class="nav-icon">🗂</span> Categories</div>
    <div class="nav-item" onclick="navTo('reports',this)"><span class="nav-icon">📄</span> Reports</div>
  </div>

  <div class="nav-section" style="padding-bottom: 24px;">
    <div class="nav-item" onclick="navTo('settings',this)"><span class="nav-icon">⚙️</span> Settings</div>
  </div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="page-title">Dashboard</div>
    </div>
    <div class="topbar-right">
