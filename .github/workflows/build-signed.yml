name: Build GKK App (Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp sw.js www/
          cp manifest.json www/
          [ -d icons ] && cp -r icons www/ || true

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add & sync Android platform
        run: |
          npx cap add android 2>/dev/null || true
          npx cap sync android

      # ── Use a fixed debug keystore so the app signature never changes ──
      # This means reinstalls and updates will NEVER conflict
      - name: Create stable debug keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GKK Debug, OU=Android, O=GKK, L=Indore, S=MP, C=IN" \
            2>/dev/null || true

      - name: Inject stable signing into build.gradle
        working-directory: android/app
        run: |
          # Add signingConfigs block and wire it to both buildTypes
          python3 - << 'PYEOF'
          import re

          with open("build.gradle", "r") as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  stableDebug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """

          # Insert signingConfigs before buildTypes
          content = content.replace(
              "    buildTypes {",
              signing_block + "    buildTypes {"
          )

          # Wire all buildTypes to use stableDebug signing
          content = re.sub(
              r'(buildTypes \{[^}]*)(release\s*\{)',
              r'\1release {\n            signingConfig signingConfigs.stableDebug',
              content
          )
          content = re.sub(
              r'(buildTypes \{[^}]*)(debug\s*\{)',
              r'\1debug {\n            signingConfig signingConfigs.stableDebug',
              content
          )

          with open("build.gradle", "w") as f:
              f.write(content)

          print("build.gradle patched successfully")
          PYEOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect & rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/GKK-latest.apk \;
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKK-latest.apk
          path: output/GKK-latest.apk
          retention-days: 30
